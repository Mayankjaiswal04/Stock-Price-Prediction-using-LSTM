<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Stock Price Prediction</h1>
        <form id="stockForm">
            <label for="ticker">Stock Ticker:</label>
            <input type="text" id="ticker" placeholder="Enter Ticker (e.g., TATAMOTORS.NS)" required>
            
            <label for="start_date">Start Date:</label>
            <input type="date" id="start_date" required>
            
            <label for="end_date">End Date:</label>
            <input type="date" id="end_date" required>
            
            <button type="submit">Predict</button>
        </form>

        <div id="loading">Loading prediction...</div>
        <div id="predictionResult"></div>
    </div>
    
    <script>
        document.getElementById('stockForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            document.getElementById('loading').style.display = 'block';
            document.getElementById('predictionResult').innerHTML = '';

            let ticker = document.getElementById('ticker').value;
            let start_date = document.getElementById('start_date').value;
            let end_date = document.getElementById('end_date').value;

            let response = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ticker, start_date, end_date})
            });

            document.getElementById('loading').style.display = 'none';

            let result = await response.json();
            if (result.error) {
                document.getElementById('predictionResult').innerHTML = `<h3 style='color: red;'>Error: ${result.error}</h3>`;
            } else {
                document.getElementById('predictionResult').innerHTML = `
                    <h3>Predicted Price: ₹${result.predicted_price}</h3>
                    <h4>Model Accuracy: ${result.accuracy}%</h4>
                    <img src="${result.plot_url}" alt="Prediction Plot">
                `;
            }
        });
    </script>
</body>
</html>
